<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017"/>
      <stop offset="100%" style="stop-color:#F0C040"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f13"/>
      <stop offset="100%" style="stop-color:#1a1a22"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  <!-- Gold accent top edge -->
  <rect x="4" y="3" width="24" height="2.5" rx="1.25" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Letter W -->
  <text x="16" y="23" font-family="Arial Black, Arial, sans-serif" font-size="15" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-0.5">W</text>
</svg>
