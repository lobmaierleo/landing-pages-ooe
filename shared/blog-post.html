<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Laden...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/shared/blog.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #1f2937;
            min-height: 100vh;
        }
        .loading { text-align: center; padding: 4rem 1rem; color: #6b7280; }
        .error { text-align: center; padding: 4rem 1rem; color: #ef4444; }
    </style>
</head>

<body>
    <main class="blog-post-container" id="blog-post">
        <p class="loading">Beitrag wird geladen...</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        (async function () {
            var SUPABASE_URL = 'https://apchqzlmhnwgnwpofemf.supabase.co';
            var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwY2hxemxtaG53Z253cG9mZW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzNjI5OTYsImV4cCI6MjA4NTkzODk5Nn0.cV2Y9D1cEzJ1tQgS_MfxPDaEqK65KNHep95-fi33cak';
            var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            var container = document.getElementById('blog-post');
            var params = new URLSearchParams(window.location.search);
            var clientSlug = params.get('client');
            var postSlug = params.get('post');

            if (!clientSlug || !postSlug) {
                container.innerHTML = '<p class="error">Ungültiger Link.</p>';
                return;
            }

            try {
                var result = await sb
                    .from('blog_posts')
                    .select('title, content, published_at')
                    .eq('client', clientSlug)
                    .eq('slug', postSlug)
                    .eq('status', 'published')
                    .single();

                if (result.error || !result.data) {
                    container.innerHTML = '<p class="error">Beitrag nicht gefunden.</p>';
                    return;
                }

                var post = result.data;
                var date = new Date(post.published_at).toLocaleDateString('de-AT', {
                    day: '2-digit', month: 'long', year: 'numeric'
                });

                document.title = post.title + ' — Blog';

                container.innerHTML =
                    '<a href="javascript:history.back()" class="blog-post-back">' +
                        '<span class="material-symbols-outlined" style="font-size:18px">arrow_back</span> Zurück' +
                    '</a>' +
                    '<article>' +
                        '<header class="blog-post-header">' +
                            '<h1 class="blog-post-title">' + escapeHtml(post.title) + '</h1>' +
                            '<p class="blog-post-meta">' + date + '</p>' +
                        '</header>' +
                        '<div class="blog-post-body">' + marked.parse(post.content) + '</div>' +
                    '</article>';
            } catch (err) {
                console.error('Blog-Post laden fehlgeschlagen:', err);
                container.innerHTML = '<p class="error">Fehler beim Laden des Beitrags.</p>';
            }

            function escapeHtml(str) {
                var div = document.createElement('div');
                div.appendChild(document.createTextNode(str));
                return div.innerHTML;
            }
        })();
    </script>
</body>

</html>
